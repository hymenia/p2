<script async defer src="https://cdn.jsdelivr.net/gh/altcha-org/altcha/dist/main/altcha.min.js" type="module"></script>

Username: <input id="username"><br>
Email: <input type="email" id="email"><br>
Password: <input type="password" id="password"><br>
<altcha-widget challenge="/api/v2/altcha"></altcha-widget><br>
<input type="button" id="submit" value="Submit"><br>
Request:  <code id="request"></code><br>
Response: <code id="response"></code>

<script>
window.onload = ()=>{
	document.getElementById("submit").onclick = async ()=>{
		const json = JSON.stringify({
			username: document.getElementById("username").value,
			email: document.getElementById("email").value,
			password: document.getElementById("password").value,
			altcha: JSON.parse(atob(document.querySelector('input[name="altcha"]').value) || "{}"),
		});

		document.getElementById("request").innerText = json;
		document.getElementById("response").innerText = await (await fetch("/api/v2/auth/register", {
			method: "POST",
			headers: {
				"Content-Type": "application/json"
			},
			body: json
		})).text();
	};
};
</script>
